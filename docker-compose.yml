version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://root:aatmanos@postgres:5432/aatman
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - JWT_SECRET=aatman_production_secret
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped
    networks:
      - aatman-network

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=aatmanos
      - POSTGRES_DB=aatman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - aatman-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aatman-network

volumes:
  pgdata:
  qdrant_data:

networks:
  aatman-network:
    driver: bridge
